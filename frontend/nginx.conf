server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: React Router owns /scan, /history, /scan/:id etc. — let
    # the app's own router resolve them instead of nginx 404ing on a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
