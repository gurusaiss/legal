# Render Blueprint — connect this repo on Render and it reads this file
# automatically ("New +" -> "Blueprint"). Defines the backend only; the
# frontend is deployed separately on Vercel (see README "Deployment").
#
# `free` plan, no disk — chosen so this deploys without a card on file.
# Trade-off: Render's free tier has no persistent disk, so the SQLite DB,
# uploaded images and generated reports all live on the container's
# ephemeral filesystem and are wiped on every restart/redeploy (and free
# instances also spin down after ~15 min idle, adding a cold-start delay
# on the next request). Fine for a demo; switch `plan` to `starter` and
# add a `disk:` block (see git history) if you need scans to persist.
services:
  - type: web
    name: legal-metrology-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: LM_JWT_SECRET
        generateValue: true
      - key: LM_ALLOWED_ORIGINS
        value: ""
        # Set this to your Vercel URL after deploying the frontend, e.g.
        # https://your-app.vercel.app — otherwise the browser's requests to
        # this API will be blocked by CORS. Update via the Render dashboard
        # (Environment tab) or `render env set`, then redeploy.
