# Render Blueprint — connect this repo on Render and it reads this file
# automatically ("New +" -> "Blueprint"). Defines the backend only; the
# frontend is deployed separately on Vercel (see README "Deployment").
#
# The `starter` plan (not `free`) is used deliberately: Render's persistent
# Disks require a paid instance. Without one, the SQLite DB, uploaded
# images and generated reports are wiped on every restart/redeploy — see
# app/paths.py and the LM_DATABASE_URL below, which all point at the same
# mounted disk so nothing is left on the ephemeral container filesystem.
services:
  - type: web
    name: legal-metrology-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    disk:
      name: lm-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LM_JWT_SECRET
        generateValue: true
      - key: LM_DATABASE_URL
        value: sqlite:////data/db/legal_metrology.db
      - key: LM_UPLOADS_DIR
        value: /data/uploads
      - key: LM_REPORTS_DIR
        value: /data/reports
      - key: LM_ALLOWED_ORIGINS
        value: ""
        # Set this to your Vercel URL after deploying the frontend, e.g.
        # https://your-app.vercel.app — otherwise the browser's requests to
        # this API will be blocked by CORS. Update via the Render dashboard
        # (Environment tab) or `render env set`, then redeploy.
